name: Software checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-software:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      MCP_HCL_ALLOW_LIVE_WRITE: "0"
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]' 'setuptools>=69'
      - name: Verify dependencies
        run: python -m pip check
      - name: Lint, formatting and full software suite
        run: python scripts/check_all.py --receipt-root work/ci-checks
      - name: Build wheel
        run: python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .
      - name: Preserve software evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-software-${{ github.sha }}
          path: |
            work/ci-checks/
            dist/*.whl
          if-no-files-found: warn
          retention-days: 14
